name: Update 3D GitHub Contributions

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: deveshmitra
        run: python scripts/generate_3d_contributions.py

      - name: Commit updated chart
        run: |
          if [[ -n "$(git status --porcelain 3d-contributions.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 3d-contributions.svg
            git commit -m "chore: update 3D GitHub contribution chart"
            git push
          else
            echo "Contribution chart is already up to date."
          fi
